[project]
name = "heim-assistant"
version = "0.1.0"
description = "Eigener lokaler KI-Assistent (Textmodus-Grundgerüst)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
heim-assistant = "heim_assistant.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
