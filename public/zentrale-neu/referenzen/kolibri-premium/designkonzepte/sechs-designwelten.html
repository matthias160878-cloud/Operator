const CATEGORIES=[{"id":"kreativ","title":"Kreativ","en":"Creative Worlds","motto":"Kreativität kennt keine Grenzen.","desc":"Farbwelten, Kunst, typografische Statements und immersive Gestaltung für mutige Marken.","col":"#c770f5","col2":"#2ce3e6","icon":"✦"},{"id":"fotografie","title":"Fotografie","en":"Visual Stories","motto":"Ein Augenblick. Tausend Geschichten.","desc":"Ausdrucksstarke Fotogalerien, warme Lichtstimmungen und moderne Portfolio-Erlebnisse.","col":"#e6b86f","col2":"#a8c9f7","icon":"◎"},{"id":"agenturen","title":"Agenturen","en":"Future Agencies","motto":"Wir gestalten die digitale Zukunft.","desc":"Strategie und Innovation als eindrucksvolle digitale Erlebnisse, mit klarer Kommunikation.","col":"#4eddeb","col2":"#977dff","icon":"◇"},{"id":"events","title":"Events","en":"Unforgettable Moments","motto":"Momente schaffen, die bleiben.","desc":"Visuelle Eventwelten für Galas, Shows, Konferenzen und außergewöhnliche Erlebnisse.","col":"#f6c575","col2":"#a56af6","icon":"✷"},{"id":"lifestyle","title":"Lifestyle","en":"The Art of Living","motto":"Dein Leben. Dein Stil. Deine Vision.","desc":"Lifestyle zwischen Luxus, Inspiration, Reisen, Natur und urbaner Kreativität.","col":"#dfb376","col2":"#d78bad","icon":"◈"},{"id":"beauty","title":"Beauty","en":"Beautiful by Design","motto":"Schönheit beginnt mit einem Gefühl.","desc":"Sinnliche Markenwelten für Kosmetik, Wellness, Schönheit und Pflege.","col":"#f1a6c6","col2":"#dfbc8b","icon":"❀"}];
const HERO_POSTER="medien/m-ae5ce3d51b.webp";
const HERO_VIDEO="medien/m-074a64fac4.mp4";

'use strict';
const Q=(sel,scope=document)=>scope.querySelector(sel);
const root=Q('#root');
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bySlug=Object.fromEntries(SITES.map(s=>[s.slug,s]));
const six=Object.fromEntries(SITES.map(s=>[s.branch,s]));
let activeFilter='alle', searchText='', lastView='';
let nextScroll=null;
function applyColors(s){const html=document.documentElement;html.style.setProperty('--a',s?.a||'#42dfe7');html.style.setProperty('--b',s?.b||'#ae80fd');html.style.setProperty('--c',s?.c||'#edc080');}
function categoryInfo(id){return CATEGORIES.find(x=>x.id===id)||{};}
function miniTitle(s){return s.name.replace(/\s+/g,' ')}
function heroPoster(){return HERO_POSTER;}
function nav(){return `<nav class="demo-nav" aria-label="Demo-Navigation"><div class="container demo-nav-inner"><a class="site-wordmark" href="#/">← ZUR DESIGNWELT</a><div class="navlinks"><a href="#services">Leistungen</a><a href="#story">Konzept</a><a href="#work">Referenzen</a><a href="#contact">Anfrage</a></div><button class="demo-control" type="button" data-toggle-motion aria-label="Farbwechsel anhalten oder starten">Farbwechsel ⏸</button></div></nav>`}
function foot(){return `<footer class="site-footer"><div class="container footer-inner"><span>SECRET 58 · MAKE IT REAL · Webseiten-Design</span><span>Eigenständige Designstudien – keine bereits realisierten Kundenprojekte</span><a href="#/">Alle Designwelten ↑</a></div></footer>`}
function home(){applyColors(null);const features=SITES.map((s,i)=>`<article class="feature"><figure><img src="${s.image}" alt="${esc(s.name)} – ${esc(s.kind)} Designstudie" loading="lazy"></figure><div class="card-body"><span class="tag">0${i+1} · ${esc(s.kind)}</span><h3>${esc(s.name)}</h3><p>${esc(s.lead)}</p><a href="#/demo/${s.slug}" class="card-link">Landingpage öffnen →</a></div></article>`).join('');return `<div class="container"><section class="home-hero glow" id="top"><div><span class="eyebrow">SECRET 58 · WEBDESIGN & DIGITALE KONZEPTE</span><h1>MAKE IT<br><span class="animated-text">REAL.</span></h1><h2>Ideen bekommen <span class="animated-text">Flügel.</span></h2><p><strong>36 Designwelten – sechs vollständig gestaltete Landingpage-Demos.</strong> Entdecke, wie individuelle Webseiten mit echten Bildwelten, Bewegung, Farbe und Typografie aussehen könnten.</p><div class="home-actions"><a class="btn" href="#six">Landingpages entdecken ↗</a><a href="#gallery" class="btn secondary">Alle 36 Konzepte ansehen</a></div><div class="hero-stats"><span><b>06</b>Branchen</span><span><b>06</b>Premium-Demos</span><span><b>36</b>Designideen</span></div></div><div class="hero-media"><video muted autoplay loop playsinline controls preload="metadata" poster="${HERO_POSTER}"><source src="${HERO_VIDEO}" type="video/mp4"></video><div class="videocap"><span><i class="pulse-dot"></i>Kolibri – animiertes Designvideo</span><span>MAKE IT REAL</span></div></div></section></div>
<section class="section" id="six"><div class="container"><div class="section-heading"><span class="eyebrow">DEINE SECHS PREMIUM-DEMOWELTEN</span><h2>Sechs Branchen. <span class="animated-text">Sechs Erlebnisse.</span></h2><p>Jedes dieser fotorealistischen Muster hat eine eigene Landingpage: mit passenden Farbanimationen, beweglicher Typografie, Inhaltsbereichen und mobiler Ansicht.</p></div><div class="featured-grid">${features}</div></div></section>
<section class="section gallery-section" id="gallery"><div class="container"><div class="section-heading"><span class="eyebrow">ALLE KONZEPTE</span><h2>36 Designwelten. <span class="animated-text">Deine Vision.</span></h2><p>Die 36 Bildentwürfe bleiben erhalten. Sechs ausgewählte Motive führen zu vollständigen Landingpage-Demos; die übrigen 30 sind anklickbare Designstudien.</p></div><div class="gallery-tools"><div class="pills" id="filters"></div><input type="search" id="search" class="search" placeholder="Nach Konzept suchen …" aria-label="Konzepte suchen"></div><div class="catalog-grid" id="catalog"></div><div class="summary-foot">Alle Abbildungen sind kreative Muster, keine belegten Kundenreferenzen. Shop, Zahlung und Buchung benötigen später eine echte Integration.</div></div></section>
<section class="big-cta"><div class="container"><div class="eyebrow">DESIGN FÜR DEINE IDEEN</div><h2>Deine Idee. <span class="animated-text">Dein Design.</span></h2><p>Starte mit einem unserer Designkonzepte – oder lass deine eigene Welt gestalten.</p><div class="buttons"><a class="btn" href="../../../index.html#/webseitenkonzepte" target="_top">SECRET 58 besuchen ↗</a></div></div></section>${foot()}`}
function drawGallery(){const filters=[{id:'alle',title:'Alle 36'},...CATEGORIES.map(b=>({id:b.id,title:b.title}))];Q('#filters').innerHTML=filters.map(f=>`<button class="pill ${activeFilter===f.id?'active':''}" data-filter="${f.id}">${esc(f.title)}</button>`).join('');const shown=CONCEPTS.filter(c=>(activeFilter==='alle'||activeFilter===c.branch)&&[c.name,c.description,c.branchName].join(' ').toLowerCase().includes(searchText));Q('#catalog').innerHTML=shown.map(c=>{const s=six[c.branch];const isDemo=s&&s.name===c.name;return `<article class="catalog-card"><img src="${c.image}" loading="lazy" alt="Konzeptmotiv ${esc(c.name)}"><div class="catalog-body"><small>${esc(c.branchName.toUpperCase())} · ${String(c.num).padStart(2,'0')}${isDemo?'<span class="live">LIVE-DEMO</span>':''}</small><h4>${esc(c.name)}</h4><p>${esc(c.description)}</p>${isDemo?`<a href="#/demo/${s.slug}">Komplette Landingpage ansehen ↗</a>`:`<button data-concept="${c.id}">Bild & Konzept ansehen ↗</button>`}</div></article>`}).join('')||'<p>Keine Konzepte gefunden.</p>'}
function renderHome(){document.title='SECRET 58 – MAKE IT REAL | 36 Designwelten';root.innerHTML=home();drawGallery();}
function excerpt(s){return `<div class="eyebrow">${esc(s.eyebrow)}</div><h1><small>${esc(s.kind)}</small><span class="animated-text">${esc(s.name)}</span></h1><h2>${esc(s.headline)}</h2><p>${esc(s.lead)}</p><div class="home-actions"><a class="btn" href="#services">Design entdecken ↗</a><a class="btn secondary" href="#contact">Projekt anfragen</a></div><p style="font-size:11px;color:#a8a0ad;margin-top:25px">SECRET 58 · Interaktive Webdesign-Demo</p>`}
function detail(s){applyColors(s);const siblings=CONCEPTS.filter(x=>x.branch===s.branch).slice(0,6);const serviceHTML=s.services.map((x,i)=>`<article class="service"><span class="service-index">LEISTUNG ${String(i+1).padStart(2,'0')}</span><h3>${esc(x[0])}</h3><p>${esc(x[1])}</p></article>`).join('');const workHTML=siblings.slice(0,3).map((c,i)=>`<button class="folio" type="button" data-concept="${c.id}"><figure><img src="${c.image}" loading="lazy" alt="Designstudie ${esc(c.name)}"></figure><span>0${i+1} · ${esc(c.name)} ↗</span></button>`).join('');const steps=s.process.map(v=>`<article class="step"><b>${esc(v[0])}</b><h3>${esc(v[1])}</h3><p>${esc(v[2])}</p></article>`).join('');const faqs=s.faq.map(v=>`<details><summary>${esc(v[0])}</summary><p>${esc(v[1])}</p></details>`).join(''); const brief=`Hallo, ich interessiere mich für das SECRET-58-Webdesign-Konzept ${s.name} (${s.kind}). Bitte senden Sie mir Informationen zur individuellen Umsetzung.`;return `<div class="demo-wrap tone-${s.tone}">${nav()}<section class="demo-hero" id="home"><div class="demo-copy">${excerpt(s)}</div><div class="demo-visual"><img src="${s.image}" alt="Fotorealistisches Referenzmotiv zu ${esc(s.name)}"><span class="floating-sign">${esc(s.slogan.toUpperCase())}</span></div></section>
<section class="demo-content-section" id="services"><div class="container"><div class="demo-heading"><span class="eyebrow">DIE IDEE HINTER DEM DESIGN</span><h2>Eine Webseite. <span class="animated-text">Viele Möglichkeiten.</span></h2><p>In diesem Muster zeigen wir, wie das Webdesign für die jeweilige Branche aufgebaut sein kann – mit echter Navigation, Animationen und einem eigenständigen Look.</p></div><div class="services">${serviceHTML}</div></div></section>
<section class="demo-content-section" id="story" style="background:#0b0c13"><div class="container story-grid"><div class="story-photo"><img src="${s.image}" loading="lazy" alt="Detail des Bildmotivs ${esc(s.name)}"></div><div class="story-text"><span class="eyebrow">DESIGNSTORY</span><h2>${esc(s.storyTitle)}</h2><p>${esc(s.story)}</p><div class="story-points">${s.showcase.map(t=>`<span>${esc(t)}</span>`).join('')}</div><a class="btn secondary" href="#work">Bildwelt entdecken ↗</a></div></div></section>
<section class="demo-content-section" id="work"><div class="container"><div class="demo-heading"><span class="eyebrow">BILDSPRACHE UND KONZEPTE</span><h2>Die passende <span class="animated-text">Designfamilie.</span></h2><p>Drei weitere Bildstudien aus derselben Branche. Diese Entwürfe zeigen unterschiedliche Richtungen und können später zu eigenen Kundenwebseiten werden.</p></div><div class="folio-gallery">${workHTML}</div><p class="small-note">Die Abbildungen sind KI-gestützte Beispielmotive – keine tatsächlichen Kundenreferenzen.</p></div></section>
<section class="demo-content-section" id="approach" style="background:#0b0c13"><div class="container"><div class="demo-heading"><span class="eyebrow">VOM KONZEPT ZUM AUFTRITT</span><h2>Drei Schritte. <span class="animated-text">Eine Vision.</span></h2><p>Ein möglicher Aufbau für die Entwicklung einer solchen Webseite.</p></div><div class="process-list">${steps}</div></div></section>
<section class="demo-content-section" id="questions"><div class="container"><div class="demo-heading"><span class="eyebrow">FRAGEN ZUR DESIGNSTUDIE</span><h2>Gut zu <span class="animated-text">wissen.</span></h2></div><div class="faq">${faqs}</div></div></section>
<section class="big-cta" id="contact"><div class="container"><span class="eyebrow">SECRET 58 · INDIVIDUELLES WEBDESIGN</span><h2>Deine Idee. <span class="animated-text">Deine Welt.</span></h2><p>Das gefällt dir? Verwende ${esc(s.name)} als Ausgangspunkt für deinen eigenen Webauftritt.</p><div class="buttons"><a href="../../../index.html#/webseitenkonzepte" class="btn" target="_top">SECRET 58 kontaktieren ↗</a><button class="btn ghost" data-copy="${esc(brief)}">Projektanfrage kopieren</button><a class="btn secondary" href="#/">Alle 36 Konzepte</a></div></div></section>${foot()}</div>`}
function navigate(){const path=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/').filter(Boolean);const slug=path[0]==='demo'?path[1]:null;const site=bySlug[slug];const previous=lastView;lastView=site?'demo:'+slug:'home'; if(site){root.innerHTML=detail(site);document.title=`${site.name} – Premium-Landingpage | SECRET 58`;document.body.dataset.view=site.slug;}else{document.body.dataset.view='home';renderHome()};if(previous!==lastView){window.scrollTo({top:0,behavior:'instant'})};if(nextScroll){let target=nextScroll;nextScroll=null;requestAnimationFrame(()=>Q('#'+target)?.scrollIntoView({behavior:'smooth'}))}if(location.hash==='#/' || !location.hash){} }
function openConcept(id){const c=CONCEPTS.find(c=>c.id===id);if(!c)return;const d=Q('#dialog');Q('#dialog-title').textContent=c.name+' · '+c.branchName;Q('#dialog-image').src=c.image;Q('#dialog-body').textContent=c.description+' — Designstudie aus der Kollektion MAKE IT REAL. Eine vollständige Landingpage kann daraus später individuell gestaltet werden.';d.hidden=false;Q('#dialog-close').focus()}
function closeConcept(){Q('#dialog').hidden=true}
async function copy(text){try{await navigator.clipboard.writeText(text)}catch(e){const t=document.createElement('textarea');t.value=text;document.body.append(t);t.select();document.execCommand('copy');t.remove()};toast('Text kopiert')}
function toast(str){let x=Q('#toast');x.textContent=str;x.hidden=false;clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>x.hidden=true,2300)}
document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){activeFilter=f.dataset.filter;drawGallery()};const c=e.target.closest('[data-concept]');if(c)openConcept(c.dataset.concept);const x=e.target.closest('[data-copy]');if(x)copy(x.dataset.copy);const t=e.target.closest('[data-toggle-motion]');if(t){const off=document.body.classList.toggle('pause-motion');t.textContent=off?'Farbwechsel ▶':'Farbwechsel ⏸'};const scroll=e.target.closest('[data-scroll]');if(scroll){nextScroll=scroll.dataset.scroll; if(document.body.dataset.view==='home') {e.preventDefault();nextScroll=null;Q('#'+scroll.dataset.scroll)?.scrollIntoView({behavior:'smooth'})}};if(e.target.id==='dialog' || e.target.closest('#dialog-close'))closeConcept()});
document.addEventListener('input',e=>{if(e.target.id==='search'){searchText=e.target.value.toLowerCase().trim();drawGallery()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeConcept()});
window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#/'))navigate()});
if(!location.hash && document.body.dataset.default && document.body.dataset.default!=='home'){location.hash='#/demo/'+document.body.dataset.default}else navigate();
</script>
</body></html>
