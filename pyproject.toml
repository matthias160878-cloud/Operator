[project]
name = "jarvis-core"
version = "0.1.0"
description = "Jarvis-Core: Auftragsführung, Freigaben, Gedächtnis und Kosten für das Agentic OS"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*"]
