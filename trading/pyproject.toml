[project]
name = "algo-trading"
version = "0.1.0"
description = "KI-gestützte Trading-Research- und Ausführungs-Pipeline (Research, Backtest, Validierung, Paper-Trading)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "anthropic>=0.69",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
crypto = ["ccxt>=4"]
mt5 = ["MetaTrader5>=5.0.45; platform_system == 'Windows'"]

[project.scripts]
algo-trading = "algo_trading.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
